plugins {
    id "com.android.application"
}

// Fester Signaturschlüssel kommt aus dem GitHub-Secret ANDROID_KEYSTORE (nie ins Repo!).
// Nur mit immer demselben Schlüssel lässt Android ein Update über die installierte App zu.
def ks = System.getenv("SR_KEYSTORE")

android {
    namespace "de.sparradar.app"
    compileSdk 34

    defaultConfig {
        applicationId "de.sparradar.app"
        minSdk 26
        targetSdk 34
        versionCode((project.findProperty("vc") ?: "1") as int)
        versionName "1." + (project.findProperty("vc") ?: "1")
    }

    signingConfigs {
        if (ks) {
            fest {
                storeFile file(ks)
                storePassword System.getenv("SR_KEYSTORE_PASS")
                keyAlias "sparradar"
                keyPassword System.getenv("SR_KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.fest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
