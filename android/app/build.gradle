plugins {
    id "com.android.application"
}

android {
    namespace "de.sparradar.app"
    compileSdk 34

    defaultConfig {
        applicationId "de.sparradar.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
