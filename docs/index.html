<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SparRadar</title>
<meta name="description" content="Angebote rund um Wörth am Rhein">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16191C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Vorschau beim Teilen des Links (WhatsApp, Mail …) -->
<meta property="og:title" content="SparRadar">
<meta property="og:description" content="Alle Angebote rund um Wörth am Rhein">
<meta property="og:image" content="https://tiry38.github.io/sparradar/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:url" content="https://tiry38.github.io/sparradar/">
<meta property="og:type" content="website">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SparRadar">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css?v=6">
<link rel="stylesheet" href="app.css?v=138">
<link rel="stylesheet" href="look.css?v=5">
<script>try{var z=JSON.parse(localStorage.getItem("sr_zoom")||"1");if(z>1){document.documentElement.style.zoom=z;document.documentElement.classList.add("zoomed")}}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="pinbar">
    <div class="brandrow">
      <div class="logo">
        <div class="logo-mark" aria-hidden="true"><img src="logo-tag.svg" alt="" width="26" height="26"></div>
        <div><h1>SparRadar</h1><small id="stand">Wörth am Rhein · 20 km · Angebote werden geladen …</small><small class="flyerinfo" id="flyerInfo" hidden></small></div>
      </div>
      <button class="zoombtn" id="zoomBtn" type="button" aria-label="Schrift größer" title="Schrift größer oder wieder normal">A+</button>
      <div class="seg" role="group" aria-label="Angebotswoche">
        <button id="wk0" aria-pressed="true">Diese Woche</button>
        <button id="wk1" aria-pressed="false">Nächste Woche</button>
      </div>
    </div>
    <div id="appUpd"></div>
    <nav class="tabs" role="tablist" aria-label="Bereiche">
      <button role="tab" id="tab-offers" aria-selected="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/></svg>Angebote</button>
      <button role="tab" id="tab-watch" aria-selected="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>Merkliste <span class="badge" id="watchBadge" hidden>0</span></button>
      <button role="tab" id="tab-list" aria-selected="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h3l2.4 12.2a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.2L21 7H6.2"/></svg><span class="tl">Einkaufszettel</span><span class="ts">Zettel</span> <span class="badge" id="listBadge" hidden>0</span></button>
      <button role="tab" id="tab-tips" aria-selected="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 12h18M12 7v13M12 7c-2-4-6-4-6-1.5S10 7 12 7Zm0 0c2-4 6-4 6-1.5S14 7 12 7Z"/></svg>Coupons <span class="badge" id="cpBadge" hidden style="background:var(--app)">0</span></button>
    </nav>
    </div>
    <div id="filters" style="display:grid;gap:10px">
      <label class="search" for="q">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Artikel oder Marke suchen, z. B. Butter, Felix, Kaffee …" autocomplete="off">
        <button class="scanbtn" id="scanBtn" type="button" aria-label="Artikel per Barcode scannen" title="Barcode scannen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button>
        <button class="clear" id="qclear" type="button" aria-label="Suche leeren" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </label>
      <div id="qSugg"></div>
      <div class="fbar" id="fbar">
        <button class="btn ghost fbtn" id="openFilter" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Kategorien &amp; Filter<span class="badge" id="fcount" hidden>0</span></button>
        <span class="fsum" id="fsum"></span>
      </div>
      <div class="chips" id="storeChips" aria-label="Märkte"></div>
      <div class="chips" id="catChips" aria-label="Kategorien"></div>
      <div class="toolbar">
        <label for="sort">Sortieren
          <select id="sort">
            <option value="off">Höchste Ersparnis</option>
            <option value="gp">Bester Grundpreis</option>
            <option value="p">Niedrigster Preis</option>
          </select>
        </label>
        <button class="btn ghost fbtn2" id="openFilter2" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Mehr Filter<span class="badge" id="fcount2" hidden>0</span></button>
        <label><button class="switch" id="appSw" role="switch" aria-checked="true" aria-label="Apps und Coupons einrechnen"></button> Apps &amp; Coupons einrechnen</label>
      </div>
    </div>
  </header>
  <main id="main"><div class="empty"><b>Angebote werden geladen …</b></div></main>
</div>
<div class="scrim" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="app.js?v=138"></script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
