name: Angebote abrufen

on:
  schedule:
    - cron: "15 4 * * *"   # jeden Tag ca. 5:15 / 6:15 Uhr deutscher Zeit
  workflow_dispatch: {}      # von Hand starten über "Run workflow"

permissions:
  contents: write

concurrency:
  group: angebote
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Angebote holen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python fetcher/fetch_offers.py

      - name: Daten speichern
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Angebote $(date +%F)"
          git push
