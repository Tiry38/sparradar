name: Angebote abrufen

on:
  schedule:
    - cron: "15 3 * * *"   # Reserve (Taktgeber startet 3:10 UTC): jeden Tag ca. 4:15 / 5:15 Uhr deutscher Zeit
    - cron: "15 17 * * 5,6,0"  # zusätzlich Fr, Sa, So ca. 18:15 / 19:15 Uhr: Prospekte der nächsten Woche, sobald die Märkte sie veröffentlichen
  workflow_dispatch: {}      # von Hand starten über "Run workflow"

permissions:
  contents: write

concurrency:
  group: angebote
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Schon gelaufen? (GitHubs Zeitplan kommt oft Stunden zu spät, der Cloudflare-Taktgeber war dann schneller)
        id: gate
        if: github.event_name == 'schedule'
        run: |
          H=$(python3 -c "import json,datetime as d;g=d.datetime.fromisoformat(json.load(open('docs/data/stand.json'))['generated']);print(int((d.datetime.now(d.timezone.utc)-g).total_seconds()//3600))" 2>/dev/null || echo 99)
          if [ "$H" -lt 6 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Letzter Abruf vor $H h – diesmal übersprungen"; fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Sichtbare Prospekte beim Start notieren
        if: steps.gate.outputs.skip != '1'
        working-directory: fetcher
        run: python check_new.py --snap || true

      - name: Zookauf- und Scheck-In-Prospekt lesen (Texterkennung, läuft parallel zum Abruf)
        if: steps.gate.outputs.skip != '1'
        # Nur neue Prospekte werden gelesen (ca. 20 min), sonst fertig in Sekunden. Fehler stoppen den Abruf nicht.
        run: |
          (sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu >/dev/null && pip install -q numpy opencv-python-headless \
            && (OMP_THREAD_LIMIT=1 timeout 15m python fetcher/fetch_zookauf.py || true) \
            && OMP_THREAD_LIMIT=1 timeout 50m python fetcher/fetch_scheck.py; touch "$RUNNER_TEMP/scheck.done") > "$RUNNER_TEMP/scheck.log" 2>&1 &

      - name: Angebote holen
        if: steps.gate.outputs.skip != '1'
        # SR_EARLY_PUSH: neue Angebote eines Markts sofort als Zwischenstand hochladen, nicht erst am Ende (ca. 40 min)
        env:
          SR_EARLY_PUSH: "1"
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          SR_SCHECK_DONE="$RUNNER_TEMP/scheck.done" python fetcher/fetch_offers.py
          echo "--- Scheck-In-Prospekt ---"; cat "$RUNNER_TEMP/scheck.log" || true

      - name: Sichtbare Prospekte merken (für den Prospekt-Wächter)
        if: steps.gate.outputs.skip != '1'
        working-directory: fetcher
        run: python check_new.py --save || true   # Fehler hier dürfen den fertigen Abruf nicht verwerfen

      - name: Bilder für neue Artikel aus eigenen Daten ergänzen (schnell, ohne Suche)
        if: steps.gate.outputs.skip != '1'
        env:
          SR_IMG_MAX: "0"
        run: python fetcher/fill_images.py || true

      - name: Daten speichern
        if: steps.gate.outputs.skip != '1'
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Angebote $(date +%F)"
          git pull --rebase -X theirs --autostash   # bei Überschneidung mit einem anderen Lauf gelten die neuen Daten
          # Nachgetragene Archiv-Preise (preisverlauf.yml) wieder einsortieren: lief der Nachtrag während dieses Abrufs,
          # hätte „theirs“ seine history.json überschrieben (03.11. passiert)
          if [ -f fetcher/backfill-rows.json ]; then
            (cd fetcher && python backfill_history.py --merge backfill-rows.json)
            git add docs/data/history.json
            git diff --cached --quiet || git commit -qm "Preisverlauf: Archiv-Preise wieder eingetragen"
          fi
          # Wiederholen, falls in der Zwischenzeit ein anderer Lauf (Bilder, Cashback, PC-Abruf) gepusht hat
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((i * 5)); git pull --rebase -X theirs --autostash || true
          done
          exit 1
