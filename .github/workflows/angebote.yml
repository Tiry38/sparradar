name: Angebote abrufen

on:
  schedule:
    - cron: "15 4 * * *"   # jeden Tag ca. 5:15 / 6:15 Uhr deutscher Zeit
    - cron: "15 17 * * 5,6,0"  # zusätzlich Fr, Sa, So ca. 18:15 / 19:15 Uhr: Prospekte der nächsten Woche, sobald die Märkte sie veröffentlichen
  workflow_dispatch: {}      # von Hand starten über "Run workflow"

permissions:
  contents: write

concurrency:
  group: angebote
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Angebote holen
        run: python fetcher/fetch_offers.py

      - name: Daten speichern
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Angebote $(date +%F)"
          git pull --rebase --autostash
          git push
