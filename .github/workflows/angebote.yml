name: Angebote abrufen

on:
  schedule:
    - cron: "15 4 * * *"   # jeden Tag ca. 5:15 / 6:15 Uhr deutscher Zeit
    - cron: "15 17 * * 5,6,0"  # zusätzlich Fr, Sa, So ca. 18:15 / 19:15 Uhr: Prospekte der nächsten Woche, sobald die Märkte sie veröffentlichen
  workflow_dispatch: {}      # von Hand starten über "Run workflow"

permissions:
  contents: write

concurrency:
  group: angebote
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Angebote holen
        # SR_EARLY_PUSH: neue Angebote eines Markts sofort als Zwischenstand hochladen, nicht erst am Ende (ca. 40 min)
        env:
          SR_EARLY_PUSH: "1"
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          python fetcher/fetch_offers.py

      - name: Sichtbare Prospekte merken (für den Prospekt-Wächter)
        working-directory: fetcher
        run: python check_new.py --save

      - name: Daten speichern
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Angebote $(date +%F)"
          git pull --rebase -X theirs --autostash   # bei Überschneidung mit einem anderen Lauf gelten die neuen Daten
          git push
