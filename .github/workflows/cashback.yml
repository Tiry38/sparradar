name: Geld-zurück-Aktionen
# Einmal am Tag eine öffentliche Übersichtsseite lesen (robots.txt erlaubt sie) -> docs/data/cashback.json
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Schon gelaufen? (GitHubs Zeitplan kommt oft Stunden zu spät, der Cloudflare-Taktgeber war dann schneller)
        id: gate
        if: github.event_name == 'schedule'
        run: |
          H=$(python3 -c "import json,datetime as d;g=d.datetime.fromisoformat(json.load(open('docs/data/cashback.json'))['at']);print(int((d.datetime.now(d.timezone.utc)-g).total_seconds()//3600))" 2>/dev/null || echo 99)
          if [ "$H" -lt 12 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "Letzter Abruf vor $H h – diesmal übersprungen"; fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python fetcher/fetch_cashback.py
        if: steps.gate.outputs.skip != '1'
      - name: Speichern
        if: steps.gate.outputs.skip != '1'
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/cashback.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Geld-zurück-Aktionen $(date +%F)"
          # mit Wiederholung, falls gleichzeitig ein anderer Lauf gepusht hat (Audit 06.11.)
          for i in 1 2 3 4; do git pull --rebase -X theirs --autostash && git push && exit 0; sleep $((i * 5)); done
          exit 1
