name: Prospekt-Wächter

# Kevins Wunsch: Die Angebote der nächsten Woche sollen so früh wie möglich in der App stehen.
# Fr–So alle 5 min (Cloudflare-Taktgeber), Do/Mo stündlich, Di–Mi 3× nur kurz auf die Marktseiten schauen (6 Seitenaufrufe). Taucht ein neuer
# Prospekt mit Startdatum in der Zukunft auf, wird sofort der komplette Abruf „Angebote abrufen“ gestartet.
on:
  schedule:
    - cron: "40 4-21 * * 4,5,6,0"     # Do, Fr, Sa, So ca. 5:40–22:40 Uhr (Sommerzeit 6:40–23:40), jede Stunde
    - cron: "40 4-20 * * 1"           # Mo ca. 5:40–21:40 Uhr jede Stunde (falls ein Prospekt erst am Montag kommt)
    - cron: "40 4,9,15 * * 2,3"       # Di, Mi 3× am Tag (dm startet neue Aktionen auch unter der Woche)
  workflow_dispatch: {}

permissions:
  contents: write  # gesehene Händlerseiten-Angebote, die noch fehlen, gleich in offers.json übernehmen
  actions: write   # um „Angebote abrufen“ zu starten

concurrency:
  group: prospekte
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Läuft gerade „Angebote abrufen“?
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow angebote.yml --limit 5 --json status -q '[.[]|select(.status!="completed")]|length')" >> "$GITHUB_OUTPUT"

      - name: Neue Prospekte?
        id: check
        working-directory: fetcher
        env:
          SR_ADD: ${{ steps.busy.outputs.n == '0' && '1' || '0' }}   # während eines Abrufs nichts selbst schreiben
        run: python check_new.py

      # Edeka/dm/Rewe zeigen je Aufruf andere 16 Angebote: was der Wächter dabei sieht und noch fehlt, kommt gleich in
      # die App (keine zusätzlichen Seitenaufrufe). Ist inzwischen ein neuer Stand online, wird nichts überschrieben.
      - name: Gesehene Angebote speichern
        if: steps.check.outputs.added != '0' && steps.check.outputs.added != '' && steps.check.outputs.new != 'true'
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/offers.json docs/data/stand.json
          git commit -q -m "Angebote $(date +%F) (+${{ steps.check.outputs.added }} vom Prospekt-Wächter)"
          git push || echo "Inzwischen neuer Stand online – nichts überschrieben, der nächste Durchgang sammelt weiter"

      - name: Kompletten Abruf starten
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Läuft der Abruf schon (oder wartet), nicht noch einen starten – er merkt sich am Ende nur die Prospekte,
        # die bei seinem Start sichtbar waren; was danach kam, findet der nächste Durchgang.
        run: |
          N=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow angebote.yml --limit 5 --json status -q '[.[]|select(.status!="completed")]|length')
          if [ "${N:-0}" -gt 0 ]; then echo "Abruf läuft schon – nicht doppelt starten"; else gh workflow run angebote.yml --ref main; fi
