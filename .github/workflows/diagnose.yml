name: Diagnose Angebotsquellen

# Nur von Hand: prüft, wie viele Angebote die Quellen liefern und ob Seiten fehlen.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Diagnose
        working-directory: fetcher
        run: python diagnose.py
