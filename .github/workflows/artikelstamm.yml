name: Artikelstamm aktualisieren

# Holt einmal pro Woche die in Deutschland meistgekauften Artikel aus Open Food Facts /
# Open Beauty Facts für die Vorschläge in Suche und Merkliste (docs/data/catalog.json).
on:
  schedule:
    - cron: "40 2 * * 0"   # sonntags ca. 3:40 / 4:40 Uhr deutscher Zeit
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: angebote          # nie gleichzeitig mit dem Angebots-Abruf committen
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Artikelstamm holen
        run: python fetcher/fetch_catalog.py

      - name: Speichern
        run: |
          git config user.name "SparRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/catalog.json docs/data/catalog-img.json
          git diff --cached --quiet || git commit -m "Artikelstamm $(date +%F)"
          git pull --rebase --autostash
          git push
