name: Apps bauen (Android + Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - "desktop/**"
      - "docs/icon.svg"
      - ".github/workflows/apps.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        run: gradle -p android assembleDebug --no-daemon
      - name: Umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SparRadar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: SparRadar.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Symbole erzeugen
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 icon ../docs/icon.svg
      - name: Setup.exe bauen
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Umbenennen
        shell: pwsh
        run: Copy-Item (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName SparRadar-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SparRadar-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Zum Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view apps --repo "$REPO" >/dev/null 2>&1 || \
            gh release create apps --repo "$REPO" --title "SparRadar Apps" \
              --notes "SparRadar.apk für Android und SparRadar-Setup.exe für Windows. Beide zeigen immer die aktuelle SparRadar-Web-App."
          gh release upload apps SparRadar.apk SparRadar-Setup.exe --repo "$REPO" --clobber
