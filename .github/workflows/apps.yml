name: Apps bauen (Android + Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - "desktop/**"
      - "docs/icon.svg"
      - ".github/workflows/apps.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # für die Versionsnummer (Anzahl Änderungen an android/)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          SR_KEYSTORE_PASS: sparradar-key
        run: |
          # Version steigt nur, wenn sich die Android-App selbst geändert hat -> nur dann Update-Hinweis
          VC=$((100 + $(git rev-list --count HEAD -- android)))
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sr.p12"
            SR_KEYSTORE="$RUNNER_TEMP/sr.p12" gradle -p android assembleRelease -Pvc=$VC --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk SparRadar.apk
            echo "$VC" > android-code.txt
          else
            echo "::warning::Secret ANDROID_KEYSTORE fehlt: APK ohne festen Schlüssel, Updates in der App sind aus."
            gradle -p android assembleDebug -Pvc=$VC --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk SparRadar.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            SparRadar.apk
            android-code.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # für die Versionsnummer (Anzahl Änderungen an desktop/)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Symbole erzeugen
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 icon ../docs/icon.svg
      - name: Setup.exe bauen
        working-directory: desktop
        shell: pwsh
        run: |
          # Version steigt nur, wenn sich das Windows-Programm selbst geändert hat -> nur dann Selbst-Update
          $n = git rev-list --count HEAD -- .
          $v = "1.0.$n"
          Set-Content -Path ../desktop-version.txt -Value $v -NoNewline
          Set-Content -Path version-config.json -Value ('{"version":"' + $v + '"}')
          npx --yes @tauri-apps/cli@2 build --bundles nsis --config version-config.json
      - name: Umbenennen
        shell: pwsh
        run: Copy-Item (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName SparRadar-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            SparRadar-Setup.exe
            desktop-version.txt

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Zum Download bereitstellen
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view apps --repo "$REPO" >/dev/null 2>&1 || \
            gh release create apps --repo "$REPO" --title "SparRadar Apps" \
              --notes "SparRadar.apk für Android und SparRadar-Setup.exe für Windows. Beide zeigen immer die aktuelle SparRadar-Web-App."
          # SparRadar-App.apk = Name zum Weiterschicken; SparRadar.apk bleibt für den Updater in der App
          cp SparRadar.apk SparRadar-App.apk
          gh release upload apps SparRadar-App.apk SparRadar.apk SparRadar-Setup.exe --repo "$REPO" --clobber
          # version.json erst nach den Dateien hochladen: sonst meldet die App ein Update, das noch nicht da ist
          # code = Android-Version (0 = ohne festen Schlüssel, kein Update-Hinweis), desktop = Windows-Version
          printf '{"code":%s,"desktop":"%s"}' "$(cat android-code.txt 2>/dev/null || echo 0)" "$(cat desktop-version.txt)" > version.json
          cat version.json
          gh release upload apps version.json --repo "$REPO" --clobber
      - name: Versionsnummer für die Web-App veröffentlichen
        # Die Web-App kann den Release wegen CORS nicht lesen, deshalb liegt die Nummer auch in docs/
        run: |
          cp dist/version.json docs/app-version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app-version.json
          git diff --cached --quiet && exit 0
          git commit -m "App-Version $(cat docs/app-version.json)"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*3)); done
          exit 1
