name: Apps bauen (Android + Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - "desktop/**"
      - "docs/icon.svg"
      - ".github/workflows/apps.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # für die Versionsnummer (Anzahl Änderungen an android/)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK bauen
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          SR_KEYSTORE_PASS: sparradar-key
        run: |
          # Version steigt nur, wenn sich die Android-App selbst geändert hat -> nur dann Update-Hinweis
          VC=$((100 + $(git rev-list --count HEAD -- android)))
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sr.p12"
            SR_KEYSTORE="$RUNNER_TEMP/sr.p12" gradle -p android assembleRelease -Pvc=$VC --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk SparRadar.apk
            echo "{\"code\":$VC}" > version.json
          else
            echo "::warning::Secret ANDROID_KEYSTORE fehlt: APK ohne festen Schlüssel, Updates in der App sind aus."
            gradle -p android assembleDebug -Pvc=$VC --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk SparRadar.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            SparRadar.apk
            version.json

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Symbole erzeugen
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 icon ../docs/icon.svg
      - name: Setup.exe bauen
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Umbenennen
        shell: pwsh
        run: Copy-Item (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName SparRadar-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SparRadar-Setup.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Zum Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view apps --repo "$REPO" >/dev/null 2>&1 || \
            gh release create apps --repo "$REPO" --title "SparRadar Apps" \
              --notes "SparRadar.apk für Android und SparRadar-Setup.exe für Windows. Beide zeigen immer die aktuelle SparRadar-Web-App."
          gh release upload apps SparRadar.apk SparRadar-Setup.exe --repo "$REPO" --clobber
          # erst nach der APK: sonst meldet die App ein Update, das noch nicht da ist
          if [ -f version.json ]; then gh release upload apps version.json --repo "$REPO" --clobber; fi
